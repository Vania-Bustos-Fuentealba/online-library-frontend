<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar compra - Online Library</title>
    <link rel="stylesheet" href="../../assets/css/tienda.css">
</head>

<body>

<header class="site-header">
    <a href="index.html" class="logo"><span>📚</span> Online Library</a>
    <nav aria-label="Menú principal">
        <ul class="menu-principal" style="list-style:none;margin:0;padding:0;">
            <li><a href="index.html">Home</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="../user/about.html">Nosotros</a></li>
            <li><a href="../user/blog.html">Blogs</a></li>
            <li><a href="../user/contact.html">Contacto</a></li>
        </ul>
    </nav>
    <a href="carrito.html" class="enlace-carrito">
        🛒 Carrito <span id="contador-carrito">0</span>
    </a>
</header>

<main>

    <h2 style="text-align:center;margin-top:40px;">Finalizar compra</h2>

    <section class="carrito">

        <form id="form-checkout" class="formulario-checkout" novalidate>

            <h3>Datos de despacho</h3>

            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" maxlength="100" autocomplete="name">
                <span class="mensaje-error" id="error-nombre"></span>
            </div>

            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" maxlength="100" autocomplete="email">
                <span class="mensaje-error" id="error-correo"></span>
            </div>

            <div class="campo">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" maxlength="300" autocomplete="street-address">
                <span class="mensaje-error" id="error-direccion"></span>
            </div>

            <div class="campo">
                <label for="comuna">Comuna</label>
                <input type="text" id="comuna" name="comuna" maxlength="100" autocomplete="address-level2">
                <span class="mensaje-error" id="error-comuna"></span>
            </div>

            <div class="campo">
                <label for="metodo-pago">Método de pago</label>
                <select id="metodo-pago" name="metodo-pago">
                    <option value="">-- Seleccione --</option>
                    <option value="credito">Tarjeta de crédito</option>
                    <option value="debito">Tarjeta de débito</option>
                    <option value="transferencia">Transferencia bancaria</option>
                </select>
                <span class="mensaje-error" id="error-metodo-pago"></span>
            </div>

            <button type="submit" class="boton">Confirmar pedido</button>

        </form>

        <aside class="resumen" id="resumen-checkout">
            <h3>Resumen de tu compra</h3>
            <div id="items-resumen"></div>
            <div class="linea-total">
                <span>Total</span>
                <span id="total-checkout">$0</span>
            </div>
        </aside>

    </section>

</main>

<footer class="site-footer">
    <div class="footer-base">
        <p>© 2026 Online Library — todos los derechos reservados.</p>
    </div>
</footer>

<script src="../../assets/js/productos.js"></script>
<script src="../../assets/js/carrito.js"></script>
<script src="../../assets/js/checkout.js"></script>

</body>
</html>
