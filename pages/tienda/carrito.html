<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi carrito - Online Library</title>
    <link rel="stylesheet" href="../../assets/css/tienda.css">
</head>

<body>

<header class="site-header">

    <a href="index.html" class="logo"><span>📚</span> Online Library</a>

    <nav aria-label="Menú principal">
        <ul class="menu-principal" style="list-style:none;margin:0;padding:0;">
            <li><a href="index.html">Home</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="../user/about.html">Nosotros</a></li>
            <li><a href="../user/blog.html">Blogs</a></li>
            <li><a href="../user/contact.html">Contacto</a></li>
        </ul>
    </nav>

    <a href="carrito.html" class="enlace-carrito activo">
        🛒 Carrito <span id="contador-carrito">0</span>
    </a>

</header>

<main>

    <h2 style="text-align:center;margin-top:40px;">Mi carrito de compras</h2>

    <section class="carrito">

        <div id="lista-carrito"></div>

        <aside class="resumen" id="resumen-carrito">

            <h3>Resumen de compra</h3>

            <div class="linea-resumen">
                <span>Subtotal</span>
                <span id="subtotal">$0</span>
            </div>

            <div class="linea-resumen" id="linea-descuento" style="display:none;">
                <span>Descuento</span>
                <span id="descuento">$0</span>
            </div>

            <div class="linea-resumen">
                <span>Despacho</span>
                <span id="envio">$0</span>
            </div>

            <div class="linea-total">
                <span>Total</span>
                <span id="total">$0</span>
            </div>

            <label for="cupon">Cupón de descuento</label>
            <div class="grupo-cupon">
                <input type="text" id="cupon" placeholder="Ej: DUOC10" autocomplete="off">
                <button class="boton" onclick="aplicarCupon()">Aplicar</button>
            </div>

            <button class="boton" onclick="finalizarCompra()">Pagar</button>
            <button class="boton boton-secundario" onclick="vaciarCarrito()">Vaciar carrito</button>

            <p style="font-size:13px;color:#666;margin-top:14px;">
                Despacho gratis en compras sobre $30.000.
            </p>

        </aside>

    </section>

</main>

<footer class="site-footer">
    <div class="footer-base">
        <p>© 2026 Online Library — todos los derechos reservados.</p>
    </div>
</footer>

<script src="../../assets/js/productos.js"></script>
<script src="../../assets/js/carrito.js"></script>

</body>
</html>
