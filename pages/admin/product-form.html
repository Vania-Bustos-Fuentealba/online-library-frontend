<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de producto | Online Library</title>

    <link rel="stylesheet" href="../../css/bootstrap.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>

<body>

<header class="admin-header">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="admin-logo">Online Library</h1>

        <div class="admin-user">
            <span>Administrador</span>
            <button class="btn btn-outline-light btn-sm" id="logoutButton">
                Cerrar sesión
            </button>
        </div>
    </div>
</header>

<div class="admin-layout">

    <aside class="admin-sidebar">
        <nav>
            <a href="index.html" class="admin-nav-link">
                Inicio
            </a>

            <a href="products.html" class="admin-nav-link active">
                Productos
            </a>

            <a href="users.html" class="admin-nav-link">
                Usuarios
            </a>
        </nav>
    </aside>

    <main class="admin-content">

        <section class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="mb-1" id="formTitle">Nuevo producto</h2>
                <p class="text-muted mb-0" id="formSubtitle">
                    Ingresa la información del nuevo producto.
                </p>
            </div>

            <a href="products.html" class="btn btn-outline-secondary">
                Volver
            </a>
        </section>

        <section class="admin-form-card">

            <form id="productForm" novalidate>

                <div class="row g-4">

                    <div class="col-12 col-md-6">
                        <label for="productCodeInput" class="form-label">
                            Código
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="productCodeInput"
                                maxlength="50"
                        >

                        <div class="invalid-feedback" id="productCodeError"></div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="productNameInput" class="form-label">
                            Nombre
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="productNameInput"
                                maxlength="100"
                        >

                        <div class="invalid-feedback" id="productNameError"></div>
                    </div>

                    <div class="col-12">
                        <label for="productDescriptionInput" class="form-label">
                            Descripción
                        </label>

                        <textarea
                                class="form-control"
                                id="productDescriptionInput"
                                rows="5"
                                maxlength="500"
                        ></textarea>

                        <div class="invalid-feedback" id="productDescriptionError"></div>

                        <div class="form-text">
                            Máximo 500 caracteres.
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="productPriceInput" class="form-label">
                            Precio
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                id="productPriceInput"
                                min="0"
                                step="0.01"
                        >

                        <div class="invalid-feedback" id="productPriceError"></div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="productCategoryInput" class="form-label">
                            Categoría
                        </label>

                        <select
                                class="form-select"
                                id="productCategoryInput"
                        >
                            <option value="">Seleccione una categoría</option>
                            <option value="Ciencia ficción">Ciencia ficción</option>
                            <option value="Fantasía">Fantasía</option>
                            <option value="Terror">Terror</option>
                            <option value="Romance">Romance</option>
                            <option value="Historia">Historia</option>
                            <option value="Tecnología">Tecnología</option>
                            <option value="Distopía">Distopía</option>
                        </select>

                        <div class="invalid-feedback" id="productCategoryError"></div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="productStockInput" class="form-label">
                            Stock
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                id="productStockInput"
                                min="0"
                                step="1"
                        >

                        <div class="invalid-feedback" id="productStockError"></div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="productCriticalStockInput" class="form-label">
                            Stock crítico
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                id="productCriticalStockInput"
                                min="0"
                                step="1"
                        >

                        <div class="invalid-feedback" id="productCriticalStockError"></div>
                    </div>

                    <div class="col-12">
                        <label for="productImageInput" class="form-label">
                            URL de imagen
                        </label>

                        <input
                                type="url"
                                class="form-control"
                                id="productImageInput"
                        >

                        <div class="invalid-feedback" id="productImageError"></div>
                    </div>

                    <div class="col-12">
                        <div class="d-flex justify-content-end gap-2 flex-wrap">

                            <a href="products.html" class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                            <button type="submit" class="btn btn-primary" id="saveProductButton">
                                Guardar producto
                            </button>

                        </div>
                    </div>

                </div>

            </form>

        </section>

    </main>

</div>

<script src="../../js/bootstrap.bundle.js"></script>
<script src="../../js/admin.js"></script>
<script src="../../js/admin-products.js"></script>

</body>
</html>
