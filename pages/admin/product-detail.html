<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de producto | Online Library</title>

    <link rel="stylesheet" href="../../css/bootstrap.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>

<body>

<header class="admin-header">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="admin-logo">Online Library</h1>

        <div class="admin-user">
            <span>Administrador</span>
            <button class="btn btn-outline-light btn-sm" id="logoutButton">
                Cerrar sesión
            </button>
        </div>
    </div>
</header>

<div class="admin-layout">

    <aside class="admin-sidebar">
        <nav>
            <a href="index.html" class="admin-nav-link">
                Inicio
            </a>

            <a href="products.html" class="admin-nav-link active">
                Productos
            </a>

            <a href="users.html" class="admin-nav-link">
                Usuarios
            </a>
        </nav>
    </aside>

    <main class="admin-content">

        <section class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="mb-1">Detalle de producto</h2>
                <p class="text-muted mb-0">
                    Información completa del libro seleccionado.
                </p>
            </div>

            <div class="d-flex gap-2">
                <a href="products.html" class="btn btn-outline-secondary">
                    Volver
                </a>

                <a href="#" id="editProductButton" class="btn btn-primary">
                    Editar producto
                </a>
            </div>
        </section>

        <section class="admin-detail-card">

            <div class="row g-4">

                <div class="col-12 col-lg-4">
                    <div class="product-image-container">
                        <img
                                id="productImage"
                                src=""
                                alt="Imagen del producto"
                                class="product-detail-image"
                        >
                    </div>
                </div>

                <div class="col-12 col-lg-8">

                    <div class="product-detail-info">

                        <div class="detail-item">
                            <span class="detail-label">Código</span>
                            <span id="productCode"></span>
                        </div>

                        <div class="detail-item">
                            <span class="detail-label">Nombre</span>
                            <span id="productName"></span>
                        </div>

                        <div class="detail-item">
                            <span class="detail-label">Categoría</span>
                            <span id="productCategory"></span>
                        </div>

                        <div class="detail-item">
                            <span class="detail-label">Precio</span>
                            <span id="productPrice"></span>
                        </div>

                        <div class="detail-item">
                            <span class="detail-label">Stock</span>
                            <span id="productStock"></span>
                        </div>

                        <div class="detail-item">
                            <span class="detail-label">Stock crítico</span>
                            <span id="productCriticalStock"></span>
                        </div>

                        <div class="detail-item detail-description">
                            <span class="detail-label">Descripción</span>
                            <p id="productDescription"></p>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="../../js/bootstrap.bundle.js"></script>
<script src="../../js/admin.js"></script>
<script src="../../js/admin-products.js"></script>

</body>
</html>
